<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Игра — Ретро-аркада</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="./app/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    /* Сцена: панель сверху и игра. На телефоне в портрете поворачивается на 90° */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      background: var(--bg);
    }

    html.rotated #stage {
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%);
      /* после поворота верх экрана телефона — это левый край сцены */
      padding: 0 var(--safe-bottom) 0 var(--safe-top);
    }

    .bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 48px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
    }
    .bar h1 {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-family: var(--font-pixel);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar .btn { height: 34px; padding: 0 12px; }
    .bar .label-short { display: none; }
    @media (max-width: 520px) {
      .bar .label-full { display: none; }
      .bar .label-short { display: inline; }
    }

    /* В полноэкранном режиме панель тоньше, чтобы больше места досталось игре */
    html.fullscreen .bar { height: 40px; }

    #frame {
      flex: 1;
      display: block;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #000;
    }

    .message {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    /* Подсказка «поверните телефон» — показывается на пару секунд */
    #turn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }
    #turn.show { opacity: 1; }
    #turn span {
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(20, 21, 19, .82);
      color: #f2ede3;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="bar">
      <a class="btn" href="./index.html" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Меню
      </a>
      <h1 id="title">Ретро-аркада</h1>
      <button class="btn" id="fs" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fs-icon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="label-full" id="fs-label">На весь экран</span>
        <span class="label-short" id="fs-label-short">Экран</span>
      </button>
    </div>
    <div id="turn"><span>Поверните телефон горизонтально</span></div>
  </div>

  <script src="./app/theme.js"></script>
  <script src="./app/games.js"></script>
  <script>
    (function () {
      'use strict';
      var tg = Arcade.tg;
      var html = document.documentElement;
      var stage = document.getElementById('stage');
      var fsBtn = document.getElementById('fs');

      // ---------- Какая игра ----------
      var id = new URLSearchParams(location.search).get('game');
      var found = id && findArcadeGame(id);

      if (!found || !found.game.ready) {
        var msg = document.createElement('div');
        msg.className = 'message';
        msg.innerHTML = '<p>Такой игры нет или она ещё в разработке.</p><a class="btn" href="./index.html">К списку игр</a>';
        stage.appendChild(msg);
        return;
      }

      document.title = found.game.title + ' — Ретро-аркада';
      document.getElementById('title').textContent = found.game.title;

      var frame = document.createElement('iframe');
      frame.id = 'frame';
      frame.title = found.game.title;
      frame.allow = 'autoplay; fullscreen; gamepad';
      frame.src = 'games/' + found.game.path + 'index.html';
      // Клавиатура должна попадать в игру, а не в окно аркады вокруг неё
      function focusGame() { try { frame.focus(); frame.contentWindow.focus(); } catch (e) {} }
      frame.addEventListener('load', focusGame);
      stage.insertBefore(frame, document.getElementById('turn'));
      // Фокус остался снаружи (кнопка, меню) — первое же нажатие возвращает его в игру
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') return;
        focusGame();
      });
      window.addEventListener('focus', function () { setTimeout(focusGame, 0); });

      // ---------- Назад в меню ----------
      function goMenu() { location.href = './index.html'; }
      if (tg) {
        Arcade.call(function () { tg.BackButton.onClick(goMenu); tg.BackButton.show(); });
      }

      // ---------- Горизонтальный режим на телефоне ----------
      // Если телефон держат вертикально, поворачиваем сцену на 90°: игра получает
      // альбомное окно. Повернул телефон — картинка встала ровно.
      var isPhone = (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) &&
                    Math.min(screen.width, screen.height) < 600;
      var hintShown = false;

      function layout() {
        var w = window.innerWidth, h = window.innerHeight;
        var rotate = isPhone && h > w;
        html.classList.toggle('rotated', rotate);
        stage.style.width = (rotate ? h : w) + 'px';
        stage.style.height = (rotate ? w : h) + 'px';
        if (rotate && !hintShown) {
          hintShown = true;
          var turn = document.getElementById('turn');
          turn.classList.add('show');
          setTimeout(function () { turn.classList.remove('show'); }, 2500);
        }
      }
      window.addEventListener('resize', layout);
      window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
      if (tg) Arcade.call(function () { tg.onEvent('viewportChanged', layout); });
      layout();

      // ---------- Полный экран ----------
      // В Telegram 8.0+ — его собственный полноэкранный режим, в браузере — Fullscreen API.
      var useTelegram = Arcade.tgAtLeast('8.0');
      var useBrowser = !useTelegram && document.fullscreenEnabled;

      function isFullscreen() {
        return useTelegram ? !!tg.isFullscreen : !!document.fullscreenElement;
      }

      function updateFsButton() {
        var on = isFullscreen();
        html.classList.toggle('fullscreen', on);
        document.getElementById('fs-label').textContent = on ? 'Выйти из полного экрана' : 'На весь экран';
        document.getElementById('fs-label-short').textContent = on ? 'Свернуть' : 'Экран';
        document.getElementById('fs-icon').setAttribute('d', on
          ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5'
          : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
        setTimeout(layout, 100);
        focusGame();
      }

      function toggleFullscreen() {
        if (useTelegram) {
          Arcade.call(function () { isFullscreen() ? tg.exitFullscreen() : tg.requestFullscreen(); });
        } else if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          html.requestFullscreen().then(function () {
            // Android Chrome в полном экране умеет закрепить альбомную ориентацию
            if (isPhone && screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function () {});
            }
          }).catch(function () {});
        }
      }

      if (useTelegram || useBrowser) {
        fsBtn.hidden = false;
        // Кнопка не забирает фокус у игры
        fsBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        fsBtn.addEventListener('click', function () { toggleFullscreen(); focusGame(); });
        if (useTelegram) {
          Arcade.call(function () {
            tg.onEvent('fullscreenChanged', updateFsButton);
            tg.onEvent('fullscreenFailed', updateFsButton);
          });
        } else {
          document.addEventListener('fullscreenchange', updateFsButton);
        }
        updateFsButton();
      }
    })();
  </script>
</body>
</html>
