<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Стол</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--card:#a39e8e;--ink:#0a0a0a;--gold:#e8b94a;--red:#a8321f;--line:#6a4826;--vg:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:repeating-linear-gradient(90deg,#1a0f07 0 38px,#0f0804 38px 40px),#0b0705;color:#d9cba8;font-family:'Press Start 2P',monospace,sans-serif;font-size:8px;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 38%,#0000 calc(var(--vg)*1%),#000f 100%);animation:fl 7s ease-in-out infinite}
.sh{position:fixed;inset:-20%;pointer-events:none;z-index:7;background:radial-gradient(circle at 30% 60%,#000b 0,#0000 35%),radial-gradient(circle at 75% 30%,#000a 0,#0000 30%);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(12%,-8%) scale(1.2)}}@keyframes fi{from{opacity:0}}@keyframes gl{50%{filter:drop-shadow(0 0 15px #ffb02099)}}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.9}}
#g{--w:min(calc(100vw - 12px),460px,calc((100dvh - 240px)*.72));display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;margin:0 auto;height:100%}
.ban{display:flex;gap:8px;width:min(calc(100vw - 12px),460px);align-items:stretch}
#mon{width:64px;height:72px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 8px #ffb02055);animation:sw 5s ease-in-out infinite,gl 3.4s ease-in-out infinite}
@keyframes sw{50%{transform:translateY(-3px)}}
.msg{flex:1;min-height:72px;border:2px solid var(--line);padding:7px;background:#000a;line-height:1.7}
.scale{width:min(calc(100vw - 12px),460px);display:flex;align-items:center;gap:8px}
.cds{display:flex;align-items:flex-end;height:22px;padding-top:8px}
.cd{width:6px;height:12px;background:#e9dcc0;margin:0 4px;position:relative;opacity:.3}
.cd.on{opacity:1}.cd.on:before{content:"";position:absolute;left:1px;top:-7px;width:4px;height:6px;background:#ffb020;box-shadow:0 -4px 10px 3px #ffb02088;animation:fk 1.6s ease-in-out var(--d,0ms) infinite alternate}
@keyframes fk{to{transform:translateY(1px) scaleY(.88);background:#ffd870}}
.tr{flex:1;height:10px;background:#000a;border:2px solid var(--line);position:relative}
.tr:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.tr i{position:absolute;top:-4px;width:12px;height:14px;margin-left:-6px;background:var(--gold);transition:left .6s ease}
.mu{flex:none;width:34px;padding:4px}
.row{width:var(--w);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.row.q{opacity:.5}
.sl{aspect-ratio:3/4;border:2px dashed #46301a;background:#0005}
.sl.tg{border-color:#8a8a8a;animation:bl 2s ease-in-out infinite}.sl.sac{border-color:var(--red);border-style:solid}
@keyframes bl{50%{opacity:.7}}
.card{position:relative;width:100%;height:100%;background:repeating-linear-gradient(0deg,#0000 0 2px,#0002 2px 3px),var(--card);border:2px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #5e5a4e,inset 0 0 16px #0008}
@keyframes in{from{transform:scale(.92);opacity:0}}
.en .card{background:repeating-linear-gradient(0deg,#0000 0 2px,#0002 2px 3px),#77736a}
.nm{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:5.5px}
.co{position:absolute;top:11px;right:3px;color:var(--red);font-size:6px}
.sg{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:4.5px}
.a,.hp{position:absolute;bottom:9px;font-size:10px}.a{left:4px}.hp{right:4px;color:var(--red)}
canvas.e{width:62%;margin-top:6px;image-rendering:pixelated}
.card.fx{animation:hit .4s}@keyframes hit{50%{transform:translateY(-12px) scale(1.08)}}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;width:var(--w)}
.hc{flex:0 0 calc(var(--w)/4 - 5px);aspect-ratio:3/4}.hc{transition:transform .25s ease}.hc.sel{outline:3px solid var(--gold);transform:translateY(-6px)}
.bt{display:flex;gap:6px;width:var(--w)}
button{flex:1;font:inherit;padding:10px 4px;background:#2a1a0e;color:#d9cba8;border:3px solid var(--line);cursor:pointer}
button:disabled{opacity:.35}.bell{background:var(--line);color:#fff}
.map{width:min(calc(100vw - 12px),460px);display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:10px;text-align:center;line-height:1.8}
.ch{display:flex;gap:10px;width:100%}.ch button{font-size:8px;padding:16px 4px;line-height:1.8}.ch b{font-size:26px;font-weight:400}
.ov{animation:fi .7s ease;position:fixed;inset:0;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;line-height:1.8;z-index:10}
.ov .rw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-height:62vh;overflow:auto}.ov .hc{flex:0 0 26vw;max-width:105px}
.ov button{flex:none;padding:12px 16px}.ov input{font:inherit;padding:12px;background:#000;color:#d9cba8;border:3px solid var(--line);width:70vw;max-width:300px;text-align:center}
</style></head><body><div class="sh"></div><div id="g"></div>
<script>
const C={sq:{n:'Белка',e:'🐿️',a:0,h:1,c:0},mouse:{n:'Мышь',e:'🐁',a:1,h:1,c:0},rat:{n:'Крыса',e:'🐀',a:1,h:2,c:1},bat:{n:'Нетопырь',e:'🦇',a:2,h:1,c:1,s:'fl'},hog:{n:'Ёж',e:'🦔',a:1,h:3,c:1,s:'th'},viper:{n:'Гадюка',e:'🐍',a:1,h:1,c:1,s:'ds'},spider:{n:'Паук',e:'🕷️',a:1,h:2,c:1,s:'fl'},wolf:{n:'Волк',e:'🐺',a:3,h:2,c:2},boar:{n:'Кабан',e:'🐗',a:2,h:4,c:2},owl:{n:'Сова',e:'🦉',a:2,h:3,c:2,s:'fl'},crab:{n:'Краб',e:'🦀',a:1,h:4,c:2,s:'th'},scor:{n:'Скорпион',e:'🦂',a:2,h:2,c:2,s:'th'},elk:{n:'Лось',e:'🦌',a:2,h:5,c:2},ghost:{n:'Призрак',e:'👻',a:3,h:1,c:2,s:'fl'},bear:{n:'Медведь',e:'🐻',a:4,h:5,c:3},eagle:{n:'Орёл',e:'🦅',a:3,h:3,c:3,s:'fl'},croc:{n:'Крокодил',e:'🐊',a:3,h:5,c:3},octo:{n:'Спрут',e:'🐙',a:2,h:6,c:3,s:'th'},shadow:{n:'Тень',e:'shadow',a:10,h:10,c:0}};
const SG={fl:'ПОЛЁТ',th:'ШИПЫ',ds:'УДАР×2'};
const START=['mouse','rat','rat','bat','hog','wolf','boar'];
const P0=['mouse','rat','bat','hog','wolf','viper'],P1=[...P0,'boar','owl','crab','spider','scor'],P2=[...P1,'elk','ghost','eagle','croc'],P3=[...P2,'bear','octo'];
const POOL=[P0,P1,P2,P3],LV=[0,0,1,2,2,2,3];
const REW=Object.keys(C).filter(k=>k!='sq'&&k!='mouse'&&k!='shadow');
const INTRO=['Тьма. Пахнет воском и сырой землёй.','Ты сидишь за столом. Свеча перед тобой — единственный свет.','— Наконец-то гость. Я так долго ждал.','— Правила просты. Принеси жертву — получишь силу. Потом звонок.','— Три свечи горят в твоих руках. Погаснут все — останешься здесь навсегда.','— А я буду смотреть, как они тают.'];
const WIN=['— Хм. Неплохо.','— Кровь пролилась не зря.','— Ты привыкаешь к столу.','— Продолжим. Дорога длинная.'];
const LOSE=['— Одна свеча погасла. Слышишь, как стало тише?','— Свеча дымится. Садись, сыграем снова.'];
const BOSS={boss:['— Ты зашёл дальше многих.','— Но на дороге есть Страж. Он голоден.'],final:['— Вот и последняя партия.','— Посмотрим, чья свеча догорит первой.']};
const END=['— Последний ход... и весы дрогнули.','— Твоя свеча горит ровно. Странно.','— Иди. Дверь за тобой открыта.','Ты поднимаешься. Стол остаётся позади, и ты впервые чувствуешь холодный сквозняк.','Тяжёлая дверь поддаётся. Ты выходишь из дома, и серый рассвет бьёт в глаза.','За спиной тихо гаснет последняя свеча. Ты свободен.'];
const TUT=['Обучение. Цель — перевесить весы: набери перевес в 5 урона, и враг проиграет.','Каждый ход бери карту: «Колода» — зверь из твоей колоды, «Белки» — дешёвая жертва.','Нажми карту в руке, затем пустую клетку своего ряда, чтобы сыграть её.','Ромбы ♦ — цена. Сначала выбери своих зверей на столе для жертвы, потом пустую клетку.','Звонок: твои звери бьют вперёд. Если напротив пусто, урон идёт на весы.','Потом бьёт враг. Его карты выходят из бледного верхнего ряда.','ПОЛЁТ — бьёт мимо защитника. ШИПЫ — ранят атакующего. УДАР×2 — бьёт дважды.','Свечи — твои жизни. Проиграешь бой — одна погаснет. Кнопка ? повторит обучение. Удачи.'];
const DEAD=['— Все свечи погасли.','— Сядь. Мы начнём сначала.'];
const SAY=['Твой ход, гость.','Карты не лгут.','Стол ждёт.','Не тяни.','Белки дёшевы. Кровь — нет.'];
const ICON={fight:'⚔️',boss:'☠️',final:'👁️',card:'🃏',candle:'🕯️',whet:'🗡️'},NAME={fight:'Бой',boss:'Страж',final:'Фитиль',card:'Алтарь карт',candle:'Свеча',whet:'Точило'};
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mk=k=>({k,a:C[k].a,h:C[k].h,_n:1}),pick1=a=>a[Math.random()*a.length|0];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null,R,lastLine='',tm;
/* музыка */
let AC,MG,mus=1,mi=0;const SC=[55,58.3,65.4,73.4,82.4,87.3,98];
function tn(f,ty,len,v,sl){if(!AC||!mus)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+len);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(MG);o.start(t);o.stop(t+len)}
function startMusic(){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.4;MG.connect(AC.destination);
 setInterval(()=>{const s=mi++;tn(SC[[0,0,1,0,2,0,1,3][s%8]],'triangle',.95,.5);
  if(s%2==0&&Math.random()<.7)tn(SC[Math.random()*7|0]*(Math.random()<.5?4:8),'square',.55,.07);
  if(s%16==8)tn(SC[0]*1.414,'sawtooth',1.8,.22);
  if(s%7==3)tn(900,'sine',.3,.04,200)},480)}catch(e){}}
function mute(){mus=!mus;if(AC)AC.resume()}
const sfx=()=>tn(140,'square',.12,.25,50);
/* ход партии */
function genMap(){return [0,1,2,3,4,5,6].map(i=>i==3?[{t:'boss'}]:i==6?[{t:'final'}]:shuf([{t:'fight'},{t:pick1(['fight','card','card','candle','whet'])}]))}
function startRun(){R={shadow:R&&R.shadow,deck:START.map(mk),cd:3,step:0,mode:'map',map:genMap(),talk:null,msg:'Коридор расходится в темноте.'};S=null;talk([...INTRO,...TUT])}
function talk(l,cb){R.talk={l,i:0,cb};render()}
function next(){const t=R.talk;t.i++;if(t.i>=t.l.length){R.talk=null;t.cb&&t.cb()}render()}
function skip(){const t=R.talk;R.talk=null;t.cb&&t.cb();render()}
function choose(i){
 const t=R.map[R.step][i].t;
 if(t=='fight')newDuel(t);
 else if(t=='boss'||t=='final')talk(BOSS[t],()=>newDuel(t));
 else if(t=='card'){R.mode='rw';R.rw=shuf([...REW]).slice(0,3);render()}
 else if(t=='whet'){R.mode='whet';render()}
 else{if(R.cd<3)R.cd++;talk(['Ты зажигаешь новую свечу.','— Согрелся? Ненадолго.'],()=>{R.step++;R.msg='Коридор расходится в темноте.'})}
}
function newDuel(t){
 R.mode='duel';
 S={lvl:LV[R.step],boss:t!='fight',dk:shuf(R.deck.map(c=>({...c}))),sq:20,hand:[],b:[null,null,null,null],eq:[null,null,null,null],eb:[null,null,null,null],scale:0,prev:0,drawn:true,sel:null,sacs:[],busy:false,turn:1,msg:'Партия началась. Сядь и играй.',fx:''};
 for(let i=0;i<3;i++)S.hand.push(S.dk.pop());S.hand.push(mk('sq'));S.sq--;if(R.shadow)S.hand.push(mk('shadow'));
 enemyQueue();if(S.boss)enemyQueue();render();
}
function enemyQueue(){
 const n=1+((S.turn+S.lvl)%(S.boss?2:3)==0?1:0);
 for(let k=0;k<n;k++){const f=[0,1,2,3].filter(i=>!S.eq[i]);if(f.length)S.eq[pick1(f)]=mk(pick1(POOL[S.lvl]))}
}
function draw(from){
 if(R.talk||S.drawn||S.busy)return;
 if(from=='sq'&&S.sq>0){S.hand.push(mk('sq'));S.sq--}
 else if(from=='dk'&&S.dk.length)S.hand.push(S.dk.pop());else return;
 S.drawn=true;S.msg='Карта в руке. Играй или звони.';render();
}
function place(i){
 const c=S.hand[S.sel],cost=C[c.k].c;
 if(S.sacs.length<cost){S.msg='Нужно жертв: '+cost+'. Выбери своих зверей.';return}
 if(S.b[i]&&!S.sacs.includes(i))return;
 S.sacs.forEach(s=>S.b[s]=null);S.hand[S.sel]._n=1;S.b[i]=S.hand.splice(S.sel,1)[0];S.sel=null;S.sacs=[];S.msg='Сыграно.';
}
document.addEventListener('click',e=>{
 if(!AC)startMusic();if(AC)AC.resume();
 const r=e.target.closest('[data-r]');
 if(r){R.deck.push(mk(R.rw[+r.dataset.r]));R.step++;R.mode='map';R.msg='Коридор расходится в темноте.';render();return}
 const w=e.target.closest('[data-w]');
 if(w){R.deck[+w.dataset.w].a++;R.step++;R.mode='map';R.msg='Клинок стал острее.';render();return}
 const t=e.target.closest('[data-z]');if(!t||R.talk||R.mode!='duel'||S.busy)return;
 const z=t.dataset.z,i=+t.dataset.i;
 if(z=='h'){S.sel=S.sel===i?null:i;S.sacs=[];S.lift=S.sel!=null;
  if(S.sel!=null&&C[S.hand[S.sel].k].c)S.msg='Выбери зверей для жертвы ('+C[S.hand[S.sel].k].c+'), затем пустую клетку.'}
 else if(z=='b'&&S.sel!=null){
  const cost=C[S.hand[S.sel].k].c,full=S.sacs.length>=cost;
  if(S.b[i]&&!(full&&S.sacs.includes(i))){
   if(!cost)return;const x=S.sacs.indexOf(i);
   if(x>=0)S.sacs.splice(x,1);else if(!full)S.sacs.push(i);
  }else place(i);
 }
 render();
});
let kb='';
document.addEventListener('keydown',e=>{
 if(e.target.tagName=='INPUT')return;
 if(e.key.length==1){kb=(kb+e.key.toLowerCase()).slice(-6);if(kb=='shadow'){kb='';cheat('shadow');return}}
 if(R.talk&&(e.key==' '||e.key=='Enter')){e.preventDefault();next();return}
 if(R.mode!='duel'||!S||S.busy||R.talk)return;
 if(e.key==' '){e.preventDefault();bell()}
 else if(/^[1-8]$/.test(e.key)&&S.hand[+e.key-1]){S.sel=+e.key-1;S.sacs=[];render()}
});
function cheat(v){
 R.cheat=0;let m;
 if(String(v).trim().toLowerCase()!='shadow')m='— Это слово ничего не значит.';
 else if(R.shadow)m='— Тень уже с тобой.';
 else{R.shadow=1;if(S&&R.mode=='duel')S.hand.push(mk('shadow'));m='— Откуда ты знаешь это слово?.. Тень уже за твоим плечом.';tn(55,'sawtooth',1.5,.4)}
 if(S&&R.mode=='duel')S.msg=m;else R.msg=m;
 render();
}
const el=(z,i)=>document.querySelector(`[data-z="${z}"][data-i="${i}"] .card`),
hurt=e=>e&&e.animate([{transform:'none',filter:'none'},{transform:'translateX(-5px)',filter:'brightness(.35) contrast(1.4)',offset:.2},{transform:'translateX(5px)',offset:.45},{transform:'translateX(-3px)',offset:.7},{transform:'none',filter:'none'}],{duration:450,easing:'ease-out'}),
setHp=(e,c)=>{const h=e&&e.querySelector('.hp');if(h)h.textContent=Math.max(c.h,0)},
fade=e=>e&&e.animate([{opacity:1},{opacity:0,transform:'scale(.85)'}],{duration:380,fill:'forwards'});
async function attack(side){
 const A=side=='p'?S.b:S.eb,D=side=='p'?S.eb:S.b,sg=side=='p'?1:-1;
 for(let i=0;i<4;i++){
  for(let n=0;n<(A[i]&&C[A[i].k].s=='ds'?2:1);n++){
   const a=A[i],d=D[i];if(!a||a.a<=0)break;
   const ae=el(side=='p'?'b':'eb',i);ae&&ae.animate([{transform:'none'},{transform:`translateY(${side=='p'?-30:30}px) scale(1.1)`,offset:.4},{transform:'none'}],{duration:520,easing:'ease-in-out'});await sleep(210);sfx();
   if(d&&C[a.k].s!='fl'){d.h-=a.a;if(C[d.k].s=='th')a.h-=1;const de=el(side=='p'?'eb':'b',i);hurt(de);setHp(de,d);if(C[d.k].s=='th')setHp(ae,a);await sleep(400);if(d.h<=0){fade(de);D[i]=null}if(a.h<=0){fade(ae);A[i]=null}await sleep(d.h<=0||a.h<=0?380:0)}
   else S.scale+=sg*a.a;
   render();if(!d||C[a.k].s=='fl')await sleep(650);else await sleep(120);
   if(Math.abs(S.scale)>=5){S.fx='';endDuel(S.scale>0);return true}
  }
 }
 S.fx='';return false;
}
async function bell(){
 if(R.talk||S.busy||!S.drawn)return;
 S.busy=true;S.sel=null;S.sacs=[];S.msg='Звонок.';tn(300,'sine',.8,.3);render();
 if(await attack('p'))return;
 S.msg='Ход хозяина стола...';render();await sleep(300);
 if(await attack('e'))return;
 for(let i=0;i<4;i++)if(S.eq[i]&&!S.eb[i]){S.eb[i]=S.eq[i];S.eb[i]._n=1;S.eq[i]=null}
 S.turn++;enemyQueue();render();await sleep(300);
 S.drawn=false;S.busy=false;
 S.msg=(S.scale<=-3?'— Слышишь, как тают свечи?':S.scale>=3?'— Пока перевес за тобой.':pick1(SAY))+' Возьми карту.';render();
}
function endDuel(win){
 S=null;R.mode='map';
 if(win){
  if(R.step==6)talk(END,()=>{R.mode='win'});
  else talk([pick1(WIN)],()=>{R.mode='rw';R.rw=shuf([...REW]).slice(0,3)});
 }else{
  R.cd--;
  if(R.cd<=0)talk(DEAD,()=>{R.mode='dead'});
  else talk([pick1(LOSE)],()=>{R.msg='Свеч осталось: '+R.cd+'. Выбери путь снова.'});
 }
}
/* отрисовка */
function card(c,x=''){const d=C[c.k],n=c._n;c._n=0;return `<div class="card ${x}"${n?' data-n="1"':''}><span class="nm">${d.n}</span><span class="co">${'♦'.repeat(d.c)}</span><canvas class="e" width="16" height="16" data-e="${d.e}"></canvas><span class="sg">${SG[d.s]||''}</span><b class="a">${c.a}</b><b class="hp">${c.h}</b></div>`}
function slot(z,i,c,cls=''){return `<div class="sl ${cls}" data-z="${z}" data-i="${i}"${cls.includes('tg')?` style="animation-delay:-${Date.now()%2000}ms"`:''}>${c?card(c,S.fx==z+i?'fx':''):''}</div>`}
function art(c){const x=c.getContext('2d'),e=c.dataset.e;x.clearRect(0,0,16,16);
 if(e=='shadow'){x.fillStyle='#8d8d8d';x.fillRect(1,1,14,14);x.fillStyle='#000';x.fillRect(5,2,6,5);x.fillRect(7,7,2,1);
  for(let y=8;y<16;y++){const w=Math.min(7,2+(y-8));x.fillRect(8-w,y,w*2,1)}
  x.fillStyle='#fff';x.fillRect(6,4,1,1);x.fillRect(9,4,1,1);return}
 x.font='13px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,8,9);
 const im=x.getImageData(0,0,16,16),d=im.data;
 for(let i=0;i<d.length;i+=4){if(d[i+3]<90){d[i+3]=0;continue}const l=.3*d[i]+.59*d[i+1]+.11*d[i+2],v=l<120?0:l<190?55:105;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
 x.putImageData(im,0,0)}
function mon(){const c=$('#mon');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,32,36);
 const f=Math.sin(Date.now()/700)>0?1:0,ec=S&&S.scale<0?'#ff4a30':'#f4f0e0';
 x.fillStyle='#07040a';for(let y=6;y<36;y++){const w=Math.min(15,5+(y-6)*.55)|0;x.fillRect(16-w,y,w*2,1)}
 x.fillStyle='#cfc6a2';x.fillRect(11,12,10,9);x.fillRect(12,21,8,3);
 x.fillStyle='#07040a';x.fillRect(12,14,3,3);x.fillRect(17,14,3,3);x.fillRect(15,18,2,2);
 for(let k=0;k<4;k++)x.fillRect(12+k*2,22,1,2);
 x.fillStyle=ec;x.fillRect(13,15+f,1,1);x.fillRect(18,15+f,1,1);
 x.fillStyle='#e9dcc0';x.fillRect(15,5,2,5);
 x.fillStyle='#ffb020';x.fillRect(15,2+f,2,3);x.fillStyle='#fff0a0';x.fillRect(15,3+f,1,1);
 x.fillStyle='#cfc6a2';x.fillRect(3,32,5,3);x.fillRect(24,32,5,3)}
function render(){
 document.body.style.setProperty('--vg',8+R.cd*10);
 const D=R.mode=='duel'&&S,line=R.talk?R.talk.l[R.talk.i]:D?S.msg:R.msg;
 let h=`<div class="ban"><canvas id="mon" width="32" height="36"></canvas><div class="msg">${line}</div></div>
 <div class="scale"><div class="cds">${[0,1,2].map(i=>`<i class="cd ${i<R.cd?'on':''}" style="--d:-${(Date.now()+i*400)%3200}ms"></i>`).join('')}</div>${D?`<div class="tr"><i style="left:${50+S.prev*10}%"></i></div>`:'<div style="flex:1"></div>'}<button class="mu" onclick="mute()">♪</button><button class="mu" onclick="R.cheat=1;render()">⌨</button><button class="mu" onclick="S&&S.busy||talk(TUT)">?</button></div>`;
 const nx=`<div class="bt"><button onclick="skip()">Пропуск</button><button class="bell" onclick="next()">Дальше ▶</button></div>`;
 if(D){
  const sel=S.sel!=null?S.hand[S.sel]:null,cost=sel?C[sel.k].c:0,full=S.sacs.length>=cost;
  const bc=i=>{if(!sel)return '';if(S.sacs.includes(i))return 'sac tg';if(!S.b[i])return(!cost||full)?'tg':'';return(cost&&!full)?'tg':''};
  const row=(z,arr,cl='')=>`<div class="row ${cl}">${[0,1,2,3].map(i=>slot(z,i,arr[i],z=='b'?bc(i):'')).join('')}</div>`;
  h+=`<div class="en">${row('eq',S.eq,'q')}</div><div class="en">${row('eb',S.eb)}</div>${row('b',S.b)}
  <div class="hand">${S.hand.map((c,i)=>`<div class="hc ${S.sel===i?'sel':''}" data-z="h" data-i="${i}">${card(c)}</div>`).join('')}</div>`;
  h+=R.talk?nx:`<div class="bt"><button ${S.drawn||S.busy||!S.dk.length?'disabled':''} onclick="draw('dk')">Колода ${S.dk.length}</button><button ${S.drawn||S.busy||!S.sq?'disabled':''} onclick="draw('sq')">Белки ${S.sq}</button><button class="bell" ${S.drawn&&!S.busy?'':'disabled'} onclick="bell()">Звонок</button></div>`;
 }else if(R.mode=='map'){
  h+=`<div class="map"><div>${[0,1,2,3,4,5,6].map(i=>i<R.step?'●':i==R.step?'◆':i==3||i==6?'☠':'○').join(' ')}</div>`+
   (R.talk?nx:`<div>Выбери дорогу<br>Колода: ${R.deck.length}</div><div class="ch">${(R.map[R.step]||[]).map((o,i)=>`<button onclick="choose(${i})"><b>${ICON[o.t]}</b><br>${NAME[o.t]}</button>`).join('')}</div>`)+`</div>`;
 }
 if(R.mode=='rw'&&!R.talk)h+=`<div class="ov"><div>Алтарь. Возьми одну карту:</div><div class="rw">${R.rw.map((k,i)=>`<div class="hc" data-r="${i}">${card(mk(k))}</div>`).join('')}</div></div>`;
 if(R.mode=='whet'&&!R.talk)h+=`<div class="ov"><div>Точило. Выбери карту: +1 к атаке</div><div class="rw">${R.deck.map((c,i)=>`<div class="hc" data-w="${i}">${card(c)}</div>`).join('')}</div></div>`;
 if(R.mode=='dead'&&!R.talk)h+=`<div class="ov"><div>Свечи погасли.<br>Стол не отпускает.</div><button onclick="startRun()">Сесть снова</button></div>`;
 if(R.mode=='win'&&!R.talk)h+=`<div class="ov"><div>Ты покинул этот дом.<br>Свечей сохранено: ${R.cd}</div><button onclick="startRun()">Сыграть снова</button></div>`;
 if(R.cheat)h+=`<div class="ov"><div>Введи код:</div><input id="cc" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')cheat(this.value)"><div class="bt" style="width:70vw;max-width:300px"><button onclick="cheat(this.parentNode.previousElementSibling.value)">OK</button><button onclick="R.cheat=0;render()">Отмена</button></div></div>`;
 const oldm=$('#mon');$('#g').innerHTML=h;if(oldm)$('#mon').replaceWith(oldm);
 document.querySelectorAll('canvas[data-e]').forEach(art);if(R.cheat)setTimeout(()=>{const i=$('#cc');i&&i.focus()},50);
 document.querySelectorAll('[data-n]').forEach(e=>e.animate([{opacity:0,transform:'translateY(-14px) scale(.92)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'}));
 if(D){const m2=$('.tr i');if(m2){m2.offsetWidth;m2.style.left=(50+S.scale*10)+'%';S.prev=S.scale}
  if(S.lift){S.lift=0;const e=$('.hc.sel');e&&e.animate([{transform:'none'},{transform:'translateY(-6px)'}],{duration:200,easing:'ease-out'})}}
 const mg=$('.msg');if(mg&&line!==lastLine){lastLine=line;clearInterval(tm);let k=0;mg.textContent='';tm=setInterval(()=>{k++;mg.textContent=line.slice(0,k);if(k%2==0)tn(170+Math.random()*50,'square',.04,.03);if(k>=line.length)clearInterval(tm)},24)}
 mon();
}
setInterval(mon,350);
document.fonts&&document.fonts.ready.then(()=>R&&render());
startRun();
</script></body></html>
