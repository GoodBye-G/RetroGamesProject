<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сесія: Коледж зв’язку</title>
<style>
:root{--bg:#111;--fg:#eee;--mut:#999}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e9ef;--fg:#222;--mut:#555}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--mut:#999}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;background:#222;touch-action:none;outline:none}
#help{margin:4px 0 0;height:18px;line-height:18px;font-size:12px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;max-width:100vw}
/* сенсорне керування */
#tc{position:fixed;inset:0;pointer-events:none}
#tc[hidden]{display:none}
#jz{position:absolute;left:0;bottom:0;width:45%;height:75%;pointer-events:auto;touch-action:none}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);
 color:#fff;font:600 14px system-ui,sans-serif;padding:0;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(241,196,15,.45);border-color:#f1c40f}
#bAtk{right:16px;bottom:16px;width:80px;height:80px;font-size:16px}
#bE{right:106px;bottom:20px;width:60px;height:60px;font-size:20px}
#bRun{right:28px;bottom:108px;width:54px;height:54px}
#bInv{right:104px;bottom:100px;width:52px;height:52px;font-size:13px}
</style></head><body>
<canvas id="c" width="960" height="540" tabindex="0"></canvas>
<p id="help">WASD/стрілки — рух · Shift — біг · Пробіл/клік — удар · E — взаємодія (утримуй, щоб зв’язати / здати борг) · I/Tab — інвентар · R — рестарт</p>
<div id="tc" hidden>
 <div id="jz"></div>
 <div id="joy"><div id="knob"></div></div>
 <button class="tb" id="bInv">Інв.</button>
 <button class="tb" id="bRun">Біг</button>
 <button class="tb" id="bE">E</button>
 <button class="tb" id="bAtk">Удар</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,H=540;
let K=1; // масштаб внутрішнього полотна (чіткість на телефонах)

// ===== ДАНІ КАРТИ: додавайте / змінюйте кабінети тут =====
// side: top|bottom, x/w — позиція вздовж коридору, door — x дверей, locked — зачинено назавжди,
// teacher:{name,color,hp,spd,dmg,r,boss} — викладач, students — к-ть зомбі-студентів у кабінеті, floor — колір підлоги
// decor — оформлення кабінету під предмет, pc — комп’ютери на партах.
// stairs: s = L|R (сторона), d = 1 (вгору) / -1 (вниз). items — аптечки (k:'melon' кавун, k:'bat' бита).
const FLOORS=[
 {stairs:[{s:'L',d:1}],items:[{x:480,y:270},{x:860,y:400,k:'melon'}],rooms:[
  {name:"Каб. 106",subject:"Захист України",side:'top',x:0,w:320,door:160,floor:'#8a7f6a',students:2,decor:'war',teacher:{name:"Зіна",color:'#16a085'}},
  {name:"Каб. 102",side:'top',x:320,w:320,locked:true},
  {name:"Каб. 103",side:'top',x:640,w:320,locked:true},
  {name:"Їдальня",side:'bottom',x:0,w:480,door:240,floor:'#7a8a6a',students:3},
  {name:"Туалет",side:'bottom',x:480,w:480,door:720,floor:'#7d7340',toilet:1,students:2}]},
 {w:2400,scary:true,cz:12,stairs:[{s:'L',d:-1},{s:'R',d:1}],items:[{x:700,y:270},{x:1500,y:270}],rooms:[
  {name:"Каб. 201",subject:"ОП",side:'top',x:150,w:400,door:350,floor:'#6e4f4f',students:1,decor:'op',teacher:{name:"Адвокат диявола",color:'#8b1e1e',hp:8,spd:95}},
  {name:"Каб. 202",subject:"Інформатика",side:'bottom',x:150,w:400,door:350,floor:'#7a8f9a',students:1,bird:1,pc:1,decor:'inf',teacher:{name:"Стас Санич",color:'#7f8c8d',hair:'#fff'}},
  {name:"Каб. 207",subject:"ОПАМ",side:'top',x:1350,w:400,door:1550,floor:'#5a7a5a',students:1,mac:1,decor:'opam',teacher:{name:"Полновіт",color:'#2e8b57',gold:1,hp:8}},
  {name:"Каб. 210",subject:"Відвідуваність",side:'bottom',x:1750,w:400,door:1950,floor:'#5a4a4a',students:2,decor:'dir',teacher:{name:"Директор",color:'#34495e',hug:1,hp:8,spd:100}},
  {name:"Каб. 203",side:'top',x:550,w:400,locked:true},{name:"Каб. 205",side:'top',x:950,w:400,locked:true},{name:"Каб. 209",side:'top',x:1750,w:400,locked:true},
  {name:"Каб. 204",side:'bottom',x:550,w:400,locked:true},{name:"Каб. 206",side:'bottom',x:950,w:400,locked:true},{name:"Каб. 208",side:'bottom',x:1350,w:400,locked:true}]},
 {w:1440,stairs:[{s:'R',d:-1}],cz:5,items:[{x:860,y:420,k:'bat'},{x:640,y:270}],zones:[{x:500,y:340,w:180,h:150}],rooms:[
  {name:"Каб. 301",subject:"Мат. аналіз",side:'top',x:0,w:480,door:240,floor:'#8a6a6a',students:4,decor:'calc',teacher:{name:"Проф. Мазур",color:'#c0392b',hp:12,spd:110}},
  {name:"Каб. 305",subject:"ОТ",side:'top',x:480,w:480,door:720,floor:'#5f6a7d',students:4,pc:1,decor:'ot',teacher:{name:"Катюша",color:'#d35400',hair:'#f1c40f',hp:10,spd:110}},
  {name:"Каб. 311",subject:"Математика",side:'top',x:960,w:480,door:1200,floor:'#4f3a3a',students:3,decor:'math',teacher:{name:"БОРИСІВНА",color:'#7b241c',boss:1,hp:24,spd:135,dmg:24,r:17}},
  {name:"Каб. 309",subject:"ООП",side:'bottom',x:0,w:480,door:240,floor:'#5a7a6a',students:4,pc:1,decor:'oop',teacher:{name:"Викладач ООП",color:'#2c3e50',hp:10,spd:112}},
  {name:"Каб. 313 (баня і зброя)",side:'bottom',x:480,w:480,door:720,floor:'#9a7a4a',free:1},
  {name:"Каб. 315",side:'bottom',x:960,w:480,locked:true}]}
];
const ARMOR=.4; // броня Борисівни: −40% шкоди
// ===== кінець даних карти =====

const dk=document.createElement('canvas');dk.width=W;dk.height=H;const dkc=dk.getContext('2d');
const keys={};let S,ePress=false;
const rnd=(a,b)=>a+Math.random()*(b-a);
const touch={run:0,atk:0};
let joy={id:null,ox:0,oy:0,x:0,y:0};

addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
 if(e.code==='KeyI'||e.code==='Tab'){if(!e.repeat)toggleInv();return}
 if(e.code==='Escape'&&S&&S.inv){S.inv=0;return}
 if(!keys[e.code]&&e.code==='KeyE')ePress=true;
 if(e.code==='KeyR')init();
 if(e.code==='Space'&&!keys.Space)attack();
 keys[e.code]=1;});
addEventListener('keyup',e=>keys[e.code]=0);
// вікно втратило фокус — відпускаємо всі клавіші, щоб герой не біг сам
function releaseAll(){for(const k in keys)keys[k]=0;touch.run=touch.atk=0;endJoy();setRunBtn()}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});

function tapCommon(){ // спільне для дотику / кліку: рестарт після поразки, закриття інвентаря
 if(S.over&&S.ot>.8){init();return true}
 if(S.inv){S.inv=0;return true}
 return false}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();cv.focus();
 if(tapCommon())return;
 if(e.pointerType==='mouse'&&e.button===0)attack();});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function toggleInv(){if(!S||S.over)return;S.inv=!S.inv;if(S.inv)releaseMove()}
function releaseMove(){for(const k of['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyE'])keys[k]=0;touch.atk=0;endJoy()}

// ===== сенсорне керування =====
const tc=document.getElementById('tc'),jz=document.getElementById('jz'),joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
const JR=50;
function joyHome(){const r=tc.getBoundingClientRect();joyEl.style.left='86px';joyEl.style.top=(r.height-86)+'px'}
function endJoy(){joy.id=null;joy.x=joy.y=0;knob.style.transform='';joyHome()}
jz.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(tapCommon())return;
 if(joy.id!==null)return;
 joy.id=e.pointerId;try{jz.setPointerCapture(e.pointerId)}catch(_){}
 joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;
 joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='';});
jz.addEventListener('pointermove',e=>{
 if(e.pointerId!==joy.id)return;
 let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy);
 if(l>JR){dx*=JR/l;dy*=JR/l}
 joy.x=dx/JR;joy.y=dy/JR;knob.style.transform='translate('+dx+'px,'+dy+'px)';});
for(const ev of['pointerup','pointercancel','lostpointercapture'])jz.addEventListener(ev,e=>{if(e.pointerId===joy.id)endJoy()});

function holdBtn(id,down,up){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}down()});
 for(const ev of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>up&&up());
 b.addEventListener('contextmenu',e=>e.preventDefault());}
holdBtn('bAtk',()=>{if(tapCommon())return;touch.atk=1;attack()},()=>touch.atk=0);
holdBtn('bE',()=>{if(S.inv){S.inv=0;return}if(!keys.KeyE)ePress=true;keys.KeyE=1},()=>keys.KeyE=0);
holdBtn('bRun',()=>{touch.run=!touch.run;setRunBtn()});
holdBtn('bInv',()=>toggleInv());
function setRunBtn(){document.getElementById('bRun').classList.toggle('on',!!touch.run)}

let TOUCH=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);
function showTouch(){tc.hidden=!TOUCH;fit()}
addEventListener('touchstart',()=>{if(!TOUCH){TOUCH=true;showTouch()}},{passive:true});

// ===== вписування у вікно (16:9, без прокрутки) =====
const help=document.getElementById('help');
function fit(){
 const w=innerWidth,h=innerHeight;
 let s=Math.min(w/W,h/H);
 const showHelp=!TOUCH&&h-H*s>=22;
 help.style.display=showHelp?'':'none';
 const cw=Math.max(1,Math.floor(W*s)),ch=Math.max(1,Math.floor(H*s));
 cv.style.width=cw+'px';cv.style.height=ch+'px';
 const dpr=Math.min(3,window.devicePixelRatio||1);
 cv.width=Math.max(W,Math.round(cw*dpr));cv.height=Math.round(cv.width*H/W);K=cv.width/W;
 if(joy.id===null)joyHome();
}
addEventListener('resize',fit);

// ===== побудова поверху =====
function buildFloor(f){
 const F={def:f,W:f.w||960,walls:[],desks:[],doors:[],zs:[],corpses:[],birds:[],poops:[],blood:[],zones:f.zones||[],items:f.items.map(i=>({...i}))};
 const Wl=(x,y,w,h)=>F.walls.push({x,y,w,h});
 Wl(0,0,F.W,15);Wl(0,525,F.W,15);
 f.rooms.forEach(r=>{
  const top=r.side==='top',wy=top?220:310;
  r.door=r.door||r.x+r.w/2;
  Wl(r.x-3,top?15:310,6,215);Wl(r.x+r.w-3,top?15:310,6,215);
  Wl(r.x,wy,r.door-25-r.x,10);Wl(r.door+25,wy,r.x+r.w-r.door-25,10);
  F.doors.push({x:r.door-25,y:wy,w:50,h:10,open:false,locked:!!r.locked,r});
  if(r.locked)return;
  for(const yy of(r.free?[]:r.toilet?(top?[25]:[480]):(top?[50,110]:[453,393])))for(let x=r.x+40;x<r.x+r.w-50;x+=80){
   const d={x,y:yy,w:36,h:22,c:r.toilet?'#e8eef0':0,desk:1,pc:r.pc};F.desks.push(d);F.walls.push(d);}
  if(r.mac){const d={x:r.x+r.w/2-50,y:top?18:496,w:100,h:26,mac:1,desk:1};F.desks.push(d);F.walls.push(d)}
  if(r.bird)F.birds.push({x:r.x+298,y:top?108:391,r,top,fl:0,tx:0,ty:0});
  if(r.toilet)for(let i=0;i<30;i++)F.poops.push({x:rnd(r.x+15,r.x+r.w-15),y:rnd((top?15:320)+10,(top?15:320)+195),r:rnd(7,14)});
  const ay=top?[150,205]:[335,380];
  for(let i=0;i<(r.students||0);i++)F.zs.push(mkStudent(rnd(r.x+30,r.x+r.w-30),rnd(...ay)));
  if(r.teacher){
   const t={type:'teacher',x:r.x+r.w/2,y:top?175:360,r:15,hp:6,state:'hostile',tie:0,debt:0,t:0,stun:0,cd:0,kx:0,ky:0,room:r,...r.teacher};t.mhp=t.hp;
   F.zs.push(t);S.teachers.push(t);}
 });
 for(let i=0;i<(f.cz||2);i++)F.zs.push(mkStudent(f.scary?150+(F.W-300)*Math.pow(Math.random(),.5):rnd(150,F.W-150),rnd(255,285)));
 if(f.scary)for(let i=0;i<160;i++)F.blood.push({x:150+(F.W-300)*Math.pow(Math.random(),.5),y:rnd(236,304),r:rnd(3,13)});
 return F;
}
function mkStudent(x,y){return{type:'student',x,y,r:11,hp:2,mhp:2,ko:0,stun:0,down:0,cd:0,kx:0,ky:0}}
function init(){
 S={teachers:[],cur:0,msg:'',mt:0,over:0,ot:0,t:0,inv:0};
 S.p={x:100,y:270,r:11,hp:100,st:100,fx:0,fy:1,cd:0,hurt:0,swing:0,armor:0,dmg:1,range:52,kits:0};
 S.fl=FLOORS.map(buildFloor);
 toast("Ти — єдиний вижилий студент. Закрий сесію!",5);
}
function toast(t,s){S.msg=t;S.mt=s||3}

function hitR(e,w){const cx=Math.max(w.x,Math.min(e.x,w.x+w.w)),cy=Math.max(w.y,Math.min(e.y,w.y+w.h));return(e.x-cx)**2+(e.y-cy)**2<e.r*e.r}
function blocked(e,F){
 if(e.x<e.r||e.x>F.W-e.r||e.y<e.r||e.y>H-e.r)return 1;
 for(const w of F.walls)if(hitR(e,w))return 1;
 for(const d of F.doors)if(!d.open&&hitR(e,d))return 1;
 return 0}
function move(e,dx,dy,F){e.x+=dx;if(blocked(e,F))e.x-=dx;e.y+=dy;if(blocked(e,F))e.y-=dy}

// ===== пряма видимість: чи немає стіни / зачинених дверей між двома точками =====
function segRect(x1,y1,x2,y2,r){
 let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
 const P=[-dx,dx,-dy,dy],Q=[x1-r.x,r.x+r.w-x1,y1-r.y,r.y+r.h-y1];
 for(let i=0;i<4;i++){
  if(P[i]===0){if(Q[i]<0)return false}
  else{const t=Q[i]/P[i];if(P[i]<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}
 return true}
function clearLine(x1,y1,x2,y2,F){
 for(const w of F.walls)if(!w.desk&&segRect(x1,y1,x2,y2,w))return false;
 for(const d of F.doors)if(!d.open&&segRect(x1,y1,x2,y2,d))return false;
 return true}
function los(a,b,F){ // центр і два краї цілі — щоб не «мазати» по ворогу, що стоїть біля одвірка
 if(clearLine(a.x,a.y,b.x,b.y,F))return true;
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=-dy/d*b.r*.7,ny=dx/d*b.r*.7;
 return clearLine(a.x,a.y,b.x+nx,b.y+ny,F)||clearLine(a.x,a.y,b.x-nx,b.y-ny,F)}

function attack(){
 if(!S||S.over||S.inv||S.p.held)return;const p=S.p,F=S.fl[S.cur];
 if(p.cd>0||p.st<10)return;
 p.cd=.35;p.st-=10;p.swing=.15;
 let killed=0;
 for(const z of F.zs){
  if(z.down||(z.type==='teacher'&&z.state!=='hostile'))continue;
  const dx=z.x-p.x,dy=z.y-p.y,d=Math.hypot(dx,dy)||1;
  if(d<p.range+z.r&&((dx*p.fx+dy*p.fy)/d>.25||d<28)&&los(p,z,F)){
   z.kx=dx/d*(z.boss?140:260);z.ky=dy/d*(z.boss?140:260);
   if(z.type==='student'){z.hp-=p.dmg;z.stun=.5;
    if(z.hp<=0){z.ko++;if(z.ko>=3){z.dead=1;killed++}else{z.stun=5;z.down=1}}}
   else{z.hp-=p.dmg;z.stun=.4;
    if(z.hp<=0){z.hp=0;z.state='stunned';z.t=z.boss?10:12;z.tie=0;
     if(z.boss&&!z.drop){z.drop=1;F.items.push({x:(z.x+p.x)/2,y:(z.y+p.y)/2,k:'armor'});toast("БОРИСІВНА впала й загубила броню! Підбери її",4)}
     else toast("Викладача оглушено! Утримуй [E], щоб зв’язати",4)}}
  }}
 if(killed){for(const z of F.zs)if(z.dead)F.corpses.push(z);F.zs=F.zs.filter(z=>!z.dead);toast("Студент більше не встане",2)}
}

function nearTeacher(z,F){return Math.hypot(z.x-S.p.x,z.y-S.p.y)<58&&los(S.p,z,F)}
function getHint(F){
 const p=S.p;
 for(const z of F.zs){if(z.type!=='teacher')continue;
  if((z.state==='stunned'||z.state==='tied')&&nearTeacher(z,F)){
   if(z.state==='stunned')return{t:"[утримуй E] Зв’язати викладача"};
   return{t:"[утримуй E] Здати борг: "+z.room.subject};}}
 for(const d of F.doors){
  if(d.open||d.locked)continue;
  if(Math.hypot(d.x+25-p.x,d.y+5-p.y)<58)return{t:"[E] Увійти в кабінет: "+d.r.name,act:()=>{d.open=true;toast("Двері відчинено")}};}
 for(const s of F.def.stairs){
  const sx=s.s==='L'?30:F.W-30;
  if(Math.hypot(sx-p.x,270-p.y)<60)return{t:"[E] "+(s.d>0?"Піднятись на ":"Спуститись на ")+(S.cur+1+s.d)+" поверх",act:()=>{
   S.cur+=s.d;p.x=s.s==='L'?80:S.fl[S.cur].W-80;p.y=270;toast("Поверх "+(S.cur+1))}};}
 return null}

function update(dt){
 S.t+=dt;if(S.mt>0)S.mt-=dt;
 if(S.over){S.ot+=dt;return}
 if(S.inv){ePress=false;return}
 const p=S.p,F=S.fl[S.cur];
 let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),
     dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(joy.id!==null&&Math.hypot(joy.x,joy.y)>.25){dx=joy.x;dy=joy.y}
 if(touch.atk)attack();
 if(p.held){const z=p.held;p.x=z.x+4;p.y=z.y+9;dx=dy=0;if(ePress){p.prom+=.1;ePress=false}p.prom=Math.max(0,p.prom-.05*dt);if(p.prom>=1){p.held=null;z.state='stunned';z.t=14;z.tie=0;p.x=z.x+30;toast("Ти пообіцяв ходити очно на пари! Директор розчулений — зв’язуй!",5)}}
 const l=Math.hypot(dx,dy);let sp=140,run=0;
 if(F.poops.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<q.r))sp*=.6;
