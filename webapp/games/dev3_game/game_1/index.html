<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Название игры — Retro Arcade</title>

  <!-- Обязательно: Telegram Web App, общая тема, общий хелпер. Не удаляйте. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../../../css/theme.css">
  <script src="../../../js/arcade.js"></script>

  <!-- Свои стили игры -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="game-header">
    <!-- Обязательно: кнопка возврата в меню (три уровня вверх) -->
    <a href="../../../index.html" class="back-btn">← В меню</a>
    <div class="score">
      СЧЁТ: <span id="score">0</span><br>
      РЕКОРД: <span id="best">0</span>
    </div>
  </header>

  <main class="game-area">
    <canvas id="game" class="game-canvas" width="320" height="320"></canvas>
  </main>

  <!-- Экранные кнопки для телефона. data-dir — что передаётся в игру -->
  <div class="touch-controls">
    <span></span>
    <button data-dir="up" aria-label="Вверх">▲</button>
    <span></span>
    <button data-dir="left" aria-label="Влево">◀</button>
    <button data-dir="down" aria-label="Вниз">▼</button>
    <button data-dir="right" aria-label="Вправо">▶</button>
  </div>

  <!-- Оверлей старта / конца игры -->
  <div class="overlay" id="overlay">
    <h1 id="overlay-title">НАЗВАНИЕ ИГРЫ</h1>
    <p class="muted" id="overlay-text">Стрелки или кнопки на экране</p>
    <button class="btn" id="start-btn">СТАРТ</button>
  </div>

  <script src="./game.js"></script>
</body>
</html>
