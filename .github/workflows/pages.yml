# Публикует папку webapp/ на GitHub Pages после каждого изменения в main.
# Игры открываются по адресу https://goodbye-g.github.io/RetroGamesProject/games/<инициалы>/<игра>/index.html
# Один раз включить: Settings → Pages → Source → GitHub Actions.
name: Публикация игр на GitHub Pages

on:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
